# Publishes the site to GitHub Pages:
#   roadtripper.quest       the main branch, with the TomTom key
#   roadtripper.quest/dev/  the dev branch (or main, if there's no dev branch),
#                           without any key: its TomTom requests get made-up answers
# Runs on every push to main or dev, so both copies are always current, and
# every 15 minutes to refresh Nevada road conditions (data/nevada.json).
#
# Nevada 511 allows 10 requests a minute for the whole key, so phones can't
# call it. Each run calls it once with the NVROADS_KEY secret and publishes
# only the roads with something to report, as part of the site (both copies).
# Nothing is committed to the repo.
#
# The TomTom key lives in the repository secret TOMTOM_KEY and is written into
# js/config.js only in the published main copy, so it never appears in the repo.
# (It is still visible on the live site, so restrict the key to
# roadtripper.quest in TomTom's Key Management page.)
name: Deploy
on:
  push:
    branches: [main, dev]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
      - name: Check out dev
        id: dev
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests (main)
        working-directory: main-src
        run: npm test
      - name: Run tests (dev)
        if: steps.dev.outcome == 'success'
        working-directory: dev-src
        run: npm test
      - name: Copy site files
        run: |
          files="index.html manifest.webmanifest sw.js css icons js"
          mkdir -p _site/dev
          (cd main-src && cp -r $files CNAME .nojekyll ../_site/)
          src=main-src
          if [ -d dev-src/js ]; then src=dev-src; fi
          (cd $src && cp -r $files ../_site/dev/)
      - name: Add TomTom key to the live copy
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: |
          if [ -z "$TOMTOM_KEY" ]; then
            echo "No TOMTOM_KEY secret; publishing without TomTom."
            exit 0
          fi
          if ! printf '%s' "$TOMTOM_KEY" | grep -Eq '^[A-Za-z0-9]+$'; then
            echo "TOMTOM_KEY should be letters and digits only." >&2
            exit 1
          fi
          f=_site/js/config.js
          if grep -q "^export const RELEASE_KEY = '';$" $f; then
            sed -i "s/^export const RELEASE_KEY = '';$/export const RELEASE_KEY = '$TOMTOM_KEY';/" $f
          else
            sed -i "s/^export const TOMTOM_KEY = '';$/export const TOMTOM_KEY = '$TOMTOM_KEY';/" $f
          fi
          grep -Eq "(RELEASE_KEY|TOMTOM_KEY) = '.+'" $f || { echo "Couldn't set the key in js/config.js." >&2; exit 1; }
      - name: Mark the dev copy
        run: |
          f=_site/dev/js/config.js
          sed -i "s/^export const DEV_BUILD = false;$/export const DEV_BUILD = true;/" $f
          if ! grep -q "DEV_BUILD = true" $f; then
            # A dev branch from before the dev site existed: make sure it has no key.
            sed -i "s/^export const TOMTOM_KEY = .*;$/export const TOMTOM_KEY = '';/" $f
          fi
          # Never publish a key in the dev copy.
          if [ -n "$TOMTOM_KEY" ] && grep -rq "$TOMTOM_KEY" _site/dev; then
            echo "The dev copy contains the TomTom key." >&2; exit 1
          fi
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
      - name: Add Nevada road conditions
        env:
          NVROADS_KEY: ${{ secrets.NVROADS_KEY }}
        run: |
          if [ -z "$NVROADS_KEY" ]; then echo "No NVROADS_KEY secret; skipping Nevada."; exit 0; fi
          mkdir -p _site/data _site/dev/data
          script=main-src/scripts/nevada.mjs
          [ -f "$script" ] || script=dev-src/scripts/nevada.mjs
          if curl -fsS --retry 2 --retry-delay 10 --max-time 60 \
              "https://www.nvroads.com/api/v3/get/roadconditions?key=$NVROADS_KEY&format=json" -o raw.json \
             && node "$script" raw.json > nevada.json; then
            if grep -q "$NVROADS_KEY" nevada.json; then echo "Key found in output." >&2; exit 1; fi
            cp nevada.json _site/data/nevada.json
            cp nevada.json _site/dev/data/nevada.json
          else
            # Keep the site up; the app says it couldn't get Nevada's conditions.
            echo "::warning::Couldn't fetch Nevada 511 road conditions."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
